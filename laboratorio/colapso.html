<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<meta name="theme-color" content="#0F3346">
<meta name="robots" content="index, follow">
<title>Colapso |ψ⟩ — Laboratorio · Walder Reyes</title>
<meta name="description" content="Experimento interactivo: un sistema de qubits entrelazados en superposición. Mide un estado y observa cómo colapsa la función de onda.">
<link rel="canonical" href="https://walder001.github.io/laboratorio/colapso.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Manrope:wght@400;500;600;700&display=swap">
<style>
  /* Tokens: same world as the portfolio, so the lab never feels foreign. */
  :root {
    --void: #0F3346; --void-rgb: 15,51,70;
    --panel: #143D52; --panel-rgb: 20,61,82;
    --line: #24566E;
    --emerald: #C8DCE4; --accent-rgb: 200,220,228;
    --mint: #EAF3F6; --light-rgb: 234,243,246;
    --text: #EEF5F7; --muted: #A9C3CD; --faint: #7C9DAB; --amber: #E8C06A; --amber-rgb: 232,192,106;
    --em-glow: 0 0 24px rgba(200,220,228,.45);
    --scene-mode: dark; --field-deep: #1E5B6E; --field-hi: #FFFFFF; --dust: #9CC3CF;
    --show-sun: inline; --show-moon: none;
    --mono: "Space Mono", "Cascadia Mono", Consolas, monospace;
    --sans: "Manrope", "Segoe UI", system-ui, sans-serif;
    --pad: clamp(16px, 3.5vw, 36px);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --void: #EEF4F6; --void-rgb: 238,244,246;
      --panel: #FFFFFF; --panel-rgb: 255,255,255;
      --line: #C8D8DF;
      --emerald: #3E6576; --accent-rgb: 62,101,118;
      --mint: #2C4B58; --light-rgb: 15,51,70;
      --text: #0F3346; --muted: #3F6273; --faint: #6A8694; --amber: #9A6B00; --amber-rgb: 154,107,0;
      --em-glow: none;
      --scene-mode: light; --field-deep: #B7CDD6; --field-hi: #0F3346; --dust: #8FAAB6;
      --show-sun: none; --show-moon: inline;
    }
  }
  :root[data-theme="light"] {
    --void: #EEF4F6; --void-rgb: 238,244,246;
    --panel: #FFFFFF; --panel-rgb: 255,255,255;
    --line: #C8D8DF;
    --emerald: #3E6576; --accent-rgb: 62,101,118;
    --mint: #2C4B58; --light-rgb: 15,51,70;
    --text: #0F3346; --muted: #3F6273; --faint: #6A8694; --amber: #9A6B00; --amber-rgb: 154,107,0;
    --em-glow: none;
    --scene-mode: light; --field-deep: #B7CDD6; --field-hi: #0F3346; --dust: #8FAAB6;
    --show-sun: none; --show-moon: inline;
  }

  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; overflow: hidden; background: var(--void); color: var(--text);
         font: 400 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 70; opacity: .035;
    background: repeating-linear-gradient(0deg, rgba(var(--light-rgb),.6) 0 1px, transparent 1px 3px); }
  a { color: inherit; }
  p { margin: 0; }
  :focus-visible { outline: 1.5px solid var(--emerald); outline-offset: 3px; border-radius: 4px; }
  h1, h2, h3 { margin: 0; font-family: var(--mono); font-weight: 700; letter-spacing: -.04em; }
  .label { font: 400 11px var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--faint); }
  .em { color: var(--emerald); }

  #space { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; }
  #space.over { cursor: pointer; }

  /* ---- Top bar ---- */
  .top { position: fixed; z-index: 20; inset: 0 0 auto 0; display: flex; align-items: center; gap: 10px 16px;
         flex-wrap: wrap; padding: 14px var(--pad); pointer-events: none; }
  .top > * { pointer-events: auto; }
  .mark { display: flex; align-items: center; gap: 9px; text-decoration: none; font: 700 14px var(--mono); letter-spacing: -.02em; }
  .ket { width: 28px; height: 26px; overflow: visible; }
  .ket path, .ket circle, .ket ellipse { fill: none; stroke: var(--emerald); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .ket .q { stroke-width: 1.4; } .ket .q2 { stroke-width: 1; opacity: .45; } .ket .v { stroke: var(--text); stroke-width: 1.5; }
  .ket .dot { fill: var(--mint); stroke: none; }
  .top .sep { flex: 1; }
  .chip-link { font: 400 12px var(--mono); color: var(--muted); text-decoration: none; border: 1px solid var(--line);
               border-radius: 6px; padding: 7px 12px; background: rgba(var(--panel-rgb),.55); backdrop-filter: blur(8px); }
  .chip-link:hover { border-color: var(--emerald); color: var(--emerald); }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; padding: 3px;
          background: rgba(var(--panel-rgb),.55); backdrop-filter: blur(8px); }
  .lang button { font: 400 11px var(--mono); color: var(--muted); background: none; border: 0; padding: 5px 9px; border-radius: 4px; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--emerald); color: var(--void); }
  .icon-btn { display: inline-grid; place-items: center; width: 34px; height: 30px; border: 1px solid var(--line);
              border-radius: 6px; background: rgba(var(--panel-rgb),.55); backdrop-filter: blur(8px); color: var(--text); cursor: pointer; }
  .icon-btn:hover { border-color: var(--emerald); color: var(--emerald); }
  .icon-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn .sun { display: var(--show-sun); } .icon-btn .moon { display: var(--show-moon); }

  /* ---- State readout ---- */
  .readout { position: fixed; z-index: 15; left: var(--pad); top: 76px; width: 268px; max-width: calc(100vw - var(--pad) * 2);
             border: 1px solid var(--line); border-radius: 10px; padding: 14px 15px 12px;
             background: rgba(var(--panel-rgb),.62); backdrop-filter: blur(10px); }
  .readout h2 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); font-weight: 400; }
  .ket-expr { margin-top: 9px; font: 400 12px/1.5 var(--mono); color: var(--muted); word-break: break-word; min-height: 36px; }
  .ket-expr b { color: var(--emerald); font-weight: 400; }
  .ket-expr.collapsed b { color: var(--amber); }
  .bars { margin-top: 12px; display: grid; gap: 7px; }
  .bar { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; font: 400 11px var(--mono); color: var(--muted); }
  .bar .n { letter-spacing: .04em; }
  .bar .v { color: var(--faint); font-variant-numeric: tabular-nums; }
  .bar .t { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: rgba(var(--light-rgb),.12); overflow: hidden; }
  .bar .t i { display: block; height: 100%; width: 0%; background: var(--emerald); border-radius: 2px;
              transition: width .18s linear, background .3s; }
  .bar.is-measured .n, .bar.is-measured .v { color: var(--amber); }
  .bar.is-measured .t i { background: var(--amber); }

  /* ---- Collapse panel, anchored to the measured node ---- */
  .collapse { position: fixed; z-index: 18; width: 300px; max-width: calc(100vw - var(--pad) * 2);
              border: 1px solid rgba(var(--amber-rgb),.5); border-radius: 12px; padding: 16px 17px 17px;
              background: rgba(var(--panel-rgb),.8); backdrop-filter: blur(14px);
              box-shadow: 0 18px 60px -22px rgba(0,0,0,.7); opacity: 0; transform: translateY(6px);
              transition: opacity .3s ease, transform .3s ease; }
  .collapse.show { opacity: 1; transform: none; }
  .collapse .kicker { color: var(--amber); }
  .collapse h3 { margin-top: 7px; font-size: 21px; }
  .collapse p { margin-top: 9px; font-size: 14.5px; line-height: 1.6; color: var(--muted); }
  .collapse .go { display: inline-flex; align-items: center; gap: 9px; margin-top: 15px; text-decoration: none;
                  font: 700 12.5px var(--mono); padding: 11px 16px; border-radius: 8px;
                  background: var(--amber); color: var(--void); border: 1px solid var(--amber); }
  .collapse .go:hover { filter: brightness(1.08); }
  .collapse .x { position: absolute; top: 9px; right: 9px; width: 26px; height: 26px; border-radius: 6px;
                 border: 1px solid transparent; background: none; color: var(--faint); cursor: pointer; font: 400 15px var(--mono); line-height: 1; }
  .collapse .x:hover { border-color: var(--line); color: var(--text); }

  /* ---- Bottom console ---- */
  .console { position: fixed; z-index: 20; inset: auto 0 0 0; display: flex; flex-wrap: wrap;
             align-items: center; justify-content: center; gap: 8px; padding: 12px var(--pad) calc(12px + env(safe-area-inset-bottom, 0px)); }
  .states { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; }
  .state { display: inline-flex; align-items: center; gap: 7px; font: 400 11.5px var(--mono); letter-spacing: .04em;
           color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer;
           background: rgba(var(--panel-rgb),.62); backdrop-filter: blur(10px); transition: color .2s, border-color .2s, background .2s; }
  .state .k { color: var(--faint); }
  .state:hover { border-color: var(--emerald); color: var(--emerald); }
  .state[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); background: rgba(var(--amber-rgb),.14); }
  .state[aria-pressed="true"] .k { color: var(--amber); }
  .ops { display: flex; gap: 7px; }
  .op { font: 700 11.5px var(--mono); letter-spacing: .04em; color: var(--text); border: 1px solid var(--line);
        border-radius: 999px; padding: 8px 16px; cursor: pointer; background: rgba(var(--panel-rgb),.62); backdrop-filter: blur(10px); }
  .op.primary { background: var(--emerald); color: var(--void); border-color: var(--emerald); }
  .op:hover { border-color: var(--emerald); }
  .op[disabled] { opacity: .4; cursor: not-allowed; }
  .hint { position: fixed; z-index: 15; right: var(--pad); bottom: 68px; max-width: 250px; text-align: right;
          padding: 8px 11px; border-radius: 8px; border: 1px solid var(--line);
          background: rgba(var(--panel-rgb),.62); backdrop-filter: blur(10px); }

  /* Fallback when WebGL or Three.js never arrives */
  .fallback { position: fixed; inset: 0; z-index: 5; display: none; place-items: center; text-align: center; padding: var(--pad); }
  .fallback p { max-width: 420px; color: var(--muted); }
  body.no-webgl .fallback { display: grid; }
  body.no-webgl .readout, body.no-webgl .hint, body.no-webgl .console { display: none; }

  @media (max-width: 900px) {
    /* --console-h is measured in JS: the chip row wraps to two or three lines
       depending on the language, so a hard-coded offset always collides. */
    .readout { top: auto; bottom: calc(var(--console-h, 132px) + 12px); left: var(--pad); right: var(--pad); width: auto; }
    .readout .bars { grid-template-columns: repeat(2, 1fr); gap: 7px 14px; }
    .hint { display: none; }
    .collapse { left: var(--pad) !important; right: var(--pad); top: 76px !important; width: auto; }
  }
  @media (max-width: 560px) {
    .top .label, .top .chip-link { display: none; }   /* keep language and theme reachable */
    .state { padding: 7px 11px; gap: 5px; }
    .op { padding: 7px 13px; }
  }
  @media (max-height: 620px) { .readout { display: none; } }
  @media (prefers-reduced-motion: reduce) {
    .collapse { transition: none; }
    .bar .t i { transition: none; }
  }
</style>
</head>
<body>

<canvas id="space" aria-hidden="true"></canvas>

<div class="top">
  <a class="mark" href="../" aria-label="Walder Reyes, inicio">
    <svg class="ket" viewBox="0 0 44 40" aria-hidden="true"><path d="M5 5v30"/><path d="M33 5l7 15-7 15"/><circle class="q" cx="19" cy="20" r="9"/><ellipse class="q2" cx="19" cy="20" rx="9" ry="3.2"/><path class="v" d="M19 20l5.6-6.6"/><circle class="dot" cx="25" cy="13" r="2.4"/></svg>
    <span>walder<b class="em">.reyes</b></span>
  </a>
  <span class="label" data-i18n="lab.tag">Laboratorio · Colapso</span>
  <span class="sep"></span>
  <a class="chip-link" href="ecosistema-3d.html" data-i18n="lab.eco">Ecosistema ↗</a>
  <div class="lang" role="group" aria-label="Idioma / Language">
    <button type="button" data-lang="es" aria-pressed="true">ES</button><button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
  <button type="button" class="icon-btn" id="themeBtn" aria-label="Cambiar entre modo claro y oscuro">
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</div>

<section class="readout" aria-labelledby="ro-h">
  <h2 id="ro-h" data-i18n="ro.h">Estado del sistema</h2>
  <p class="ket-expr" id="ketExpr" aria-live="polite"></p>
  <div class="bars" id="bars"></div>
</section>

<article class="collapse" id="panel" role="region" aria-live="polite" hidden>
  <button type="button" class="x" id="panelX" aria-label="Volver a la superposición">✕</button>
  <p class="label kicker" id="panelKicker"></p>
  <h3 id="panelTitle"></h3>
  <p id="panelDesc"></p>
  <a class="go" id="panelGo" href="../"><span id="panelCta"></span> <span aria-hidden="true">→</span></a>
</article>

<p class="label hint" data-i18n="lab.hint">Haz clic en un nodo para medirlo · Esc vuelve a la superposición</p>

<div class="console">
  <div class="states" id="states" role="group" aria-label="Estados medibles"></div>
  <div class="ops">
    <button type="button" class="op primary" id="measure" data-i18n="op.measure">Medir |ψ⟩</button>
    <button type="button" class="op" id="reset" data-i18n="op.reset" disabled>Reiniciar</button>
  </div>
</div>

<div class="fallback">
  <div>
    <p class="label" data-i18n="fb.k">Sin WebGL</p>
    <h3 style="margin:10px 0" data-i18n="fb.h">Este experimento necesita WebGL</h3>
    <p data-i18n="fb.p">Tu navegador no pudo iniciar la escena 3D. El resto del portafolio funciona igual.</p>
    <p style="margin-top:18px"><a class="chip-link" href="../" data-i18n="fb.b">Volver al portafolio</a></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
/* ---------------------------------------------------------------------------
   Colapso |psi> — five entangled states in superposition.
   Measuring one collapses the system onto it. Click a node, a chip, or roll
   the dice with "Medir": the outcome follows the live Born probabilities.
--------------------------------------------------------------------------- */

/* ---------- Content: every basis state points at a real part of the site ---------- */
const STATES = [
  { id: "trabajo",    href: "../#trabajo",    at: [-3.2, 3.4, -3.0],
    es: { t: "Trabajo",    d: "Automatización financiera, IA sobre documentos y arquitectura modular.", c: "Ver casos" },
    en: { t: "Work",       d: "Financial automation, AI over documents and modular architecture.",     c: "See cases" } },
  { id: "dwald",      href: "../#dwald",      at: [ 1.2, 4.6, -8.0],
    es: { t: "DWALD",      d: "DWALD POS y DWALD Loan: productos propios, de la idea al negocio.",     c: "Conocer DWALD" },
    en: { t: "DWALD",      d: "DWALD POS and DWALD Loan: our own products, from idea to business.",    c: "Explore DWALD" } },
  { id: "principios", href: "../#principios", at: [ 5.4, 3.0, -2.0],
    es: { t: "Principios", d: "Cómo decido qué construir y cómo lo construyo.",                        c: "Leer principios" },
    en: { t: "Principles", d: "How I decide what to build, and how I build it.",                       c: "Read principles" } },
  { id: "escritos",   href: "../#escritos",   at: [ 0.2, 2.2,  2.2],
    es: { t: "Escritos",   d: "Notas sobre ingeniería, producto y ciencia aplicada.",                  c: "Leer escritos" },
    en: { t: "Writing",    d: "Notes on engineering, product and applied science.",                    c: "Read writing" } },
  { id: "contacto",   href: "../#contacto",   at: [-6.4, 4.2, -9.0],
    es: { t: "Contacto",   d: "Ingeniería, producto o colaboración: hablemos.",                        c: "Escríbeme" },
    en: { t: "Contact",    d: "Engineering, product or collaboration: let's talk.",                    c: "Write to me" } },
];

const UI = {
  es: {
    "lab.tag": "Laboratorio · Colapso", "lab.eco": "Ecosistema ↗",
    "lab.hint": "Haz clic en un nodo para medirlo · Esc vuelve a la superposición",
    "ro.h": "Estado del sistema", "op.measure": "Medir |ψ⟩", "op.reset": "Reiniciar",
    "panel.kicker": "Estado medido", "close": "Volver a la superposición",
    "fb.k": "Sin WebGL", "fb.h": "Este experimento necesita WebGL",
    "fb.p": "Tu navegador no pudo iniciar la escena 3D. El resto del portafolio funciona igual.",
    "fb.b": "Volver al portafolio",
  },
  en: {
    "lab.tag": "Lab · Collapse", "lab.eco": "Ecosystem ↗",
    "lab.hint": "Click a node to measure it · Esc returns to superposition",
    "ro.h": "System state", "op.measure": "Measure |ψ⟩", "op.reset": "Reset",
    "panel.kicker": "Measured state", "close": "Back to superposition",
    "fb.k": "No WebGL", "fb.h": "This experiment needs WebGL",
    "fb.p": "Your browser could not start the 3D scene. The rest of the portfolio works fine.",
    "fb.b": "Back to the portfolio",
  },
};

let lang = "es";
const tr = (k) => (UI[lang] && UI[lang][k]) || UI.es[k] || k;   /* not `t`: the scene uses that name for time */
const copy = (i) => STATES[i][lang] || STATES[i].es;

/* ---------- Theme ---------- */
(function () {
  const docEl = document.documentElement;
  try { const s = localStorage.getItem("wr-theme"); if (s === "light" || s === "dark") docEl.dataset.theme = s; } catch (e) {}
  const current = () => docEl.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  document.getElementById("themeBtn").addEventListener("click", () => {
    const next = current() === "dark" ? "light" : "dark";
    docEl.dataset.theme = next;
    try { localStorage.setItem("wr-theme", next); } catch (e) {}
  });
})();

/* ---------- Chips, one per basis state ---------- */
const statesEl = document.getElementById("states");
const barsEl = document.getElementById("bars");
STATES.forEach((s, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "state"; b.dataset.i = i; b.setAttribute("aria-pressed", "false");
  b.innerHTML = '<span class="k">|' + i + '⟩</span><span class="nm"></span>';
  statesEl.appendChild(b);

  const row = document.createElement("div");
  row.className = "bar";
  row.innerHTML = '<span class="n"></span><span class="v">0%</span><span class="t"><i></i></span>';
  barsEl.appendChild(row);
});
const chipEls = [...statesEl.querySelectorAll(".state")];
const barEls = [...barsEl.querySelectorAll(".bar")];

/* ---------- Language ---------- */
function setLang(next) {
  lang = next;
  document.documentElement.lang = next;
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = tr(el.dataset.i18n); });
  STATES.forEach((s, i) => {
    const c = copy(i);
    chipEls[i].querySelector(".nm").textContent = c.t;
    chipEls[i].setAttribute("aria-label", c.t + " — " + c.d);
    barEls[i].querySelector(".n").textContent = c.t;
  });
  document.getElementById("panelX").setAttribute("aria-label", tr("close"));
  document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === next)));
  if (measured >= 0) fillPanel(measured);
  try { localStorage.setItem("wr-lang", next); } catch (e) {}
}
document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.lang)));

/* ---------- Panel ---------- */
const panel = document.getElementById("panel");
function fillPanel(i) {
  const c = copy(i);
  document.getElementById("panelKicker").textContent = tr("panel.kicker") + "  |" + i + "⟩";
  document.getElementById("panelTitle").textContent = c.t;
  document.getElementById("panelDesc").textContent = c.d;
  document.getElementById("panelCta").textContent = c.c;
  document.getElementById("panelGo").href = STATES[i].href;
}

/* ---------- Measurement state, shared with the scene ---------- */
let measured = -1;
const probs = STATES.map(() => 1 / STATES.length);
const listeners = [];
const onMeasure = (fn) => listeners.push(fn);

function measure(i, viaKeyboard, force) {
  if (i === measured && !force) return;
  measured = i;
  chipEls.forEach((el, k) => el.setAttribute("aria-pressed", String(k === i)));
  barEls.forEach((el, k) => el.classList.toggle("is-measured", k === i));
  document.getElementById("ketExpr").classList.add("collapsed");
  document.getElementById("reset").disabled = false;
  fillPanel(i);
  panel.hidden = false;
  requestAnimationFrame(() => panel.classList.add("show"));
  if (viaKeyboard) document.getElementById("panelGo").focus({ preventScroll: true });
  listeners.forEach((fn) => fn(i));
}

function release() {
  if (measured < 0) return;
  const was = measured;
  measured = -1;
  chipEls.forEach((el) => el.setAttribute("aria-pressed", "false"));
  barEls.forEach((el) => el.classList.remove("is-measured"));
  document.getElementById("ketExpr").classList.remove("collapsed");
  document.getElementById("reset").disabled = true;
  panel.classList.remove("show");
  setTimeout(() => { if (measured < 0) panel.hidden = true; }, 320);
  if (document.activeElement && panel.contains(document.activeElement)) chipEls[was].focus({ preventScroll: true });
  listeners.forEach((fn) => fn(-1));
}

chipEls.forEach((el) => el.addEventListener("click", (e) => {
  const i = +el.dataset.i;
  i === measured ? release() : measure(i, e.detail === 0);
}));
document.getElementById("panelX").addEventListener("click", release);
document.getElementById("reset").addEventListener("click", release);
document.getElementById("measure").addEventListener("click", () => {
  /* Born rule: the outcome is drawn from the live amplitudes, not chosen. */
  let r = Math.random(), i = 0;
  for (; i < probs.length - 1; i++) { r -= probs[i]; if (r <= 0) break; }
  measure(i, false, true);
});
addEventListener("keydown", (e) => { if (e.key === "Escape") release(); });

/* The console wraps differently per language and screen width, so measure it
   instead of guessing an offset for the readout to sit above. */
(function () {
  const el = document.querySelector(".console");
  const publish = () => document.documentElement.style.setProperty("--console-h", el.offsetHeight + "px");
  if (window.ResizeObserver) new ResizeObserver(publish).observe(el); else addEventListener("resize", publish);
  publish();
})();

/* ---------- The scene ---------- */
(function () {
  const canvas = document.getElementById("space");
  if (!window.THREE) { document.body.classList.add("no-webgl"); return; }
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" }); }
  catch (err) { document.body.classList.add("no-webgl"); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));

  const scene = new THREE.Scene();
  scene.background = new THREE.Color();
  scene.fog = new THREE.FogExp2(0x0f3346, 0.026);
  const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 200);
  const world = new THREE.Group(); scene.add(world);

  /* Soft radial sprite reused by every glow, point and photon */
  const spr = document.createElement("canvas"); spr.width = spr.height = 64;
  const sx = spr.getContext("2d"), g = sx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(.35, "rgba(255,255,255,.45)"); g.addColorStop(1, "rgba(255,255,255,0)");
  sx.fillStyle = g; sx.fillRect(0, 0, 64, 64);
  const sprite = new THREE.CanvasTexture(spr);
  const glowMats = [];
  const glow = (key, o, s) => {
    const mat = new THREE.SpriteMaterial({ map: sprite, transparent: true, opacity: o, depthWrite: false });
    mat.userData = { key: key, o: o }; glowMats.push(mat);
    const m = new THREE.Sprite(mat); m.scale.set(s, s, 1); return m;
  };

  /* ---- Wave-function field. Fewer points on small screens. ---- */
  const small = Math.min(innerWidth, innerHeight) < 720;
  const GX = small ? 110 : 170, GZ = small ? 78 : 120, SX = 52, SZ = 38;
  const N = GX * GZ, pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
  for (let iz = 0, k = 0; iz < GZ; iz++) for (let ix = 0; ix < GX; ix++, k += 3) {
    pos[k] = (ix / (GX - 1) - .5) * SX; pos[k + 2] = (iz / (GZ - 1) - .5) * SZ - 6;
  }
  const fGeo = new THREE.BufferGeometry();
  fGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  fGeo.setAttribute("color", new THREE.BufferAttribute(col, 3));
  const fieldMat = new THREE.PointsMaterial({ size: .13, map: sprite, vertexColors: true, transparent: true, depthWrite: false });
  world.add(new THREE.Points(fGeo, fieldMat));
  const cDeep = new THREE.Color(), cEm = new THREE.Color(), cHi = new THREE.Color(), cAm = new THREE.Color(), tc = new THREE.Color();

  /* Three ambient sources, one cursor source, one measurement shock-wave. */
  const sources = [
    { x: -8, z: -8, ph: 0, a: 1 }, { x: 9, z: -12, ph: 2.1, a: .9 },
    { x: 2, z: 2, ph: 4, a: 0 },   { x: 0, z: 0, ph: 0, a: 0 },
  ];
  const CURSOR = 2, SHOCK = 3;

  /* ---- Qubits. Per-node materials: sharing them would light all five at once. ---- */
  const hitMat = new THREE.MeshBasicMaterial({ visible: false });
  const shellGeo = new THREE.SphereGeometry(.75, 24, 16);
  const coreGeo = new THREE.SphereGeometry(.16, 20, 20);
  const ringGeo = new THREE.TorusGeometry(.75, .01, 6, 90);
  const hitGeo = new THREE.SphereGeometry(1.25, 12, 8);
  const qubits = STATES.map((s, i) => {
    const grp = new THREE.Group(); grp.position.set(s.at[0], s.at[1], s.at[2]); world.add(grp);
    const core = new THREE.MeshBasicMaterial({ transparent: true, opacity: 1 });
    const shell = new THREE.MeshBasicMaterial({ wireframe: true, transparent: true, opacity: .12 });
    const ring = new THREE.MeshBasicMaterial({ transparent: true, opacity: .6 });
    grp.add(new THREE.Mesh(coreGeo, core));
    const halo = glow("--emerald", .9, 1.6); grp.add(halo);
    const shellMesh = new THREE.Mesh(shellGeo, shell); grp.add(shellMesh);
    const ringMesh = new THREE.Mesh(ringGeo, ring); ringMesh.rotation.x = Math.PI / 2; grp.add(ringMesh);
    const tip = glow("--field-hi", 1, .35); grp.add(tip);
    const hit = new THREE.Mesh(hitGeo, hitMat); hit.userData.i = i; grp.add(hit);
    return {
      grp: grp, shellMesh: shellMesh, ringMesh: ringMesh, tip: tip, hit: hit,
      mats: { core: core, shell: shell, ring: ring }, glows: [halo.material, tip.material],
      base: s.at[1], ph: i * 1.3,
      w: 1,    /* visual weight: 1 alive, ~.14 when another state was measured */
      f: 0,    /* own focus factor */
      p: 1 / STATES.length, /* live probability */
    };
  });
  const hits = qubits.map((q) => q.hit);

  /* ---- Entanglement. Vertex colours so one edge can dim while another stays lit. ---- */
  const pairs = [[0, 1], [1, 2], [0, 3], [3, 2], [0, 4]];
  const ePos = new Float32Array(pairs.length * 6), eCol = new Float32Array(pairs.length * 6);
  const eGeo = new THREE.BufferGeometry();
  eGeo.setAttribute("position", new THREE.BufferAttribute(ePos, 3));
  eGeo.setAttribute("color", new THREE.BufferAttribute(eCol, 3));
  const eMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: .35, depthWrite: false });
  world.add(new THREE.LineSegments(eGeo, eMat));
  const photons = pairs.map(() => { const s = glow("--field-hi", 1, .28); world.add(s); return { s: s, t: Math.random() }; });

  /* ---- Dust ---- */
  const D = small ? 380 : 700, dp = new Float32Array(D * 3);
  for (let i = 0; i < D; i++) { dp[i * 3] = (Math.random() - .5) * 90; dp[i * 3 + 1] = Math.random() * 30 - 2; dp[i * 3 + 2] = -10 - Math.random() * 60; }
  const dGeo = new THREE.BufferGeometry(); dGeo.setAttribute("position", new THREE.BufferAttribute(dp, 3));
  const dustMat = new THREE.PointsMaterial({ size: .1, map: sprite, transparent: true, opacity: .6, depthWrite: false });
  world.add(new THREE.Points(dGeo, dustMat));

  let ready = false;   /* set once setup is complete: guards the reduced-motion repaints */
  let composer = null, bloom = null;
  if (THREE.EffectComposer && THREE.UnrealBloomPass) {
    composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    bloom = new THREE.UnrealBloomPass(new THREE.Vector2(1, 1), .7, .55, .42);
    composer.addPass(bloom);
  }

  /* ---- Theme: the scene reads the same CSS tokens as the page ---- */
  let dark = true, glowF = 1;
  function applyTheme() {
    const s = getComputedStyle(document.documentElement);
    const v = (n) => s.getPropertyValue(n).trim();
    dark = v("--scene-mode") !== "light";
    glowF = dark ? 1 : .6;
    scene.background.set(v("--void")); scene.fog.color.set(v("--void"));
    cDeep.set(v("--field-deep")); cEm.set(v("--emerald")); cHi.set(v("--field-hi")); cAm.set(v("--amber"));
    const blend = dark ? THREE.AdditiveBlending : THREE.NormalBlending;
    [fieldMat, eMat, dustMat].concat(glowMats).forEach((m) => { m.blending = blend; m.needsUpdate = true; });
    glowMats.forEach((m) => { m.color.set(v(m.userData.key)); m.opacity = m.userData.o * glowF; });
    qubits.forEach((q) => {
      q.mats.core.color.set(dark ? v("--field-hi") : v("--emerald"));
      q.mats.shell.color.set(v("--emerald"));
      q.mats.shell.userData.o = dark ? .12 : .28;
      q.mats.ring.color.set(v("--emerald"));
      q.mats.ring.userData.o = .6;
    });
    eMat.color.set(0xffffff); eMat.opacity = dark ? .35 : .5;
    dustMat.color.set(v("--dust")); dustMat.opacity = dark ? .6 : .45;
    fieldMat.size = dark ? .13 : .11;
    if (reduce && ready) frame(0);
  }
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  matchMedia("(prefers-color-scheme: light)").addEventListener("change", applyTheme);

  /* ---- Pointer ---- */
  let mx = 0, my = 0, active = 0, t = 0, W = 1, H = 1;
  let ndcX = 0, ndcY = 0, hover = -1, downAt = null;
  addEventListener("pointermove", (e) => {
    mx = (e.clientX / innerWidth) * 2 - 1; my = (e.clientY / innerHeight) * 2 - 1; active = 1;
    ndcX = mx; ndcY = -my;
    pick();                 /* hover answers on the event, not on the next frame */
    if (reduce && ready) frame(0);
  });
  canvas.addEventListener("pointerleave", () => { active = 0; });
  /* Latch the target on press. The nodes drift, so re-picking on release would
     sometimes measure a neighbour — or nothing — after an aim the user got right. */
  canvas.addEventListener("pointerdown", (e) => {
    ndcX = (e.clientX / innerWidth) * 2 - 1; ndcY = -((e.clientY / innerHeight) * 2 - 1);
    pick();
    downAt = { x: e.clientX, y: e.clientY, i: hover };
  });
  canvas.addEventListener("pointerup", (e) => {
    /* Ignore drags and scroll flings: only a still tap counts as a measurement. */
    if (!downAt || Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 12) { downAt = null; return; }
    const i = downAt.i; downAt = null;
    i >= 0 ? (i === measured ? release() : measure(i, false)) : release();
  });
  canvas.addEventListener("pointercancel", () => { downAt = null; });

  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  function pick() {
    world.updateMatrixWorld();
    ndc.set(ndcX, ndcY);
    ray.setFromCamera(ndc, camera);
    const hitList = ray.intersectObjects(hits, false);
    hover = hitList.length ? hitList[0].object.userData.i : -1;
    canvas.classList.toggle("over", hover >= 0);
  }

  function layout() {
    W = innerWidth; H = innerHeight;
    renderer.setSize(W, H, false);
    if (composer) { composer.setSize(W, H); bloom.resolution.set(W, H); }
    camera.aspect = W / H; camera.updateProjectionMatrix();
    if (reduce && ready) frame(0);
  }
  addEventListener("resize", layout); layout();

  /* ---- Measurement hook: shock-wave through the field ---- */
  onMeasure((i) => {
    if (i >= 0) {
      const s = sources[SHOCK], q = qubits[i];
      s.x = q.grp.position.x; s.z = q.grp.position.z; s.ph = t * 2.4; s.a = 2.6;
    }
    /* Releasing needs the repaint just as much as measuring: with no loop
       running, nothing else would ever restore the superposition on screen. */
    if (reduce && ready) frame(0);
  });

  /* ---- Frame ---- */
  const a = new THREE.Vector3(), b = new THREE.Vector3();
  const free = new THREE.Vector3(), freeAt = new THREE.Vector3();
  const camPos = new THREE.Vector3(), camAt = new THREE.Vector3(), lookAt = new THREE.Vector3(), nodeP = new THREE.Vector3();
  const proj = new THREE.Vector3();
  let camF = 0, camNode = null;
  const ease = (cur, to, dt, k) => (reduce ? to : cur + (to - cur) * Math.min(1, dt * k));
  const ketExpr = document.getElementById("ketExpr");
  let hudAt = 0;

  function frame(dt) {
    t += dt;

    /* The prepared state keeps breathing whatever we observe: `probs` is what the
       source actually holds and what the Born draw samples, while `q.p` is what the
       readout and the scene show — that one does collapse onto the outcome. */
    let sum = 0;
    qubits.forEach((q, i) => { q.raw = .55 + .45 * (Math.sin(t * .33 + i * 1.9) * .5 + .5); sum += q.raw; });
    qubits.forEach((q, i) => {
      probs[i] = q.raw / sum;
      const to = measured < 0 ? probs[i] : (i === measured ? 1 : 0);
      q.p = ease(q.p, to, dt, 4.5);
      /* Snap once the ease is visually done: a measured state must read 100%, not 97%. */
      if (measured >= 0 && Math.abs(q.p - to) < .006) q.p = to;
    });

    /* Cursor source and the decaying measurement shock-wave */
    const m = sources[CURSOR];
    m.x += ((mx * 18) - m.x) * .06;
    m.z += ((my * 13 - 2) - m.z) * .06;
    m.a += ((active ? 1.2 : 0) - m.a) * .04;
    sources[SHOCK].a = ease(sources[SHOCK].a, 0, dt, 1.1);
    sources[0].x = -8 + Math.sin(t * .25) * 4; sources[1].z = -12 + Math.cos(t * .2) * 4;

    for (let i = 0, k = 0; i < N; i++, k += 3) {
      const x = pos[k], z = pos[k + 2];
      let h = 0;
      for (let s = 0; s < sources.length; s++) {
        const S = sources[s]; if (S.a < .01) continue;
        const d = Math.sqrt((x - S.x) * (x - S.x) + (z - S.z) * (z - S.z));
        h += S.a * Math.sin(d * 1.15 - t * 2.4 + S.ph) * Math.exp(-d * .075);
      }
      pos[k + 1] = h * .9;
      const val = Math.max(0, Math.min(1, (h + 1.1) / 2.2));
      if (val < .6) tc.copy(cDeep).lerp(cEm, val / .6); else tc.copy(cEm).lerp(cHi, (val - .6) / .4);
      const f = dark ? .55 + .75 * val : 1;
      col[k] = tc.r * f; col[k + 1] = tc.g * f; col[k + 2] = tc.b * f;
    }
    fGeo.attributes.position.needsUpdate = true; fGeo.attributes.color.needsUpdate = true;

    /* Qubits: weight, focus, probability-driven presence */
    qubits.forEach((q, i) => {
      const lit = measured < 0 || i === measured;
      q.w = ease(q.w, lit ? 1 : .14, dt, 3.4);
      q.f = ease(q.f, i === measured ? 1 : 0, dt, 3.2);
      const hov = hover === i && measured < 0 ? 1 : 0;
      const pw = q.p * STATES.length;              /* 1 at a uniform distribution */
      const swell = 1 + (pw - 1) * .12 + q.f * .5 + hov * .1;

      q.grp.position.y = q.base + Math.sin(t * 1.1 + q.ph) * .25;
      q.shellMesh.rotation.y += dt * (.4 + q.f * 1.4);
      q.shellMesh.scale.setScalar(swell);
      q.ringMesh.scale.setScalar(swell);

      const th = 1 + .5 * Math.sin(t * .7 + q.ph), phi = t * (1.4 + q.f * 2.2) + q.ph;
      const r = .75 * swell;
      q.tip.position.set(r * Math.sin(th) * Math.cos(phi), r * Math.cos(th), r * Math.sin(th) * Math.sin(phi));

      /* A measured node turns amber; the rest stay in the cold palette. */
      tc.copy(dark ? cHi : cEm).lerp(cAm, q.f);
      q.mats.core.color.copy(tc);
      q.mats.core.opacity = q.w * (1 - q.f * .4);
      tc.copy(cEm).lerp(cAm, q.f);
      q.mats.shell.color.copy(tc); q.mats.ring.color.copy(tc);
      q.mats.shell.opacity = q.mats.shell.userData.o * q.w * (1 + q.f * 1.6 + hov * .8);
      q.mats.ring.opacity = q.mats.ring.userData.o * q.w * (1 + hov * .5);
      q.glows.forEach((gm, gi) => {
        const base = gm.userData.o * glowF * q.w;
        gm.opacity = base * (gi === 0 ? (.55 + pw * .45 - q.f * .32 + hov * .25) : 1);
        if (gi === 0) { tc.copy(cEm).lerp(cAm, q.f); gm.color.copy(tc); }
      });
    });

    /* Entanglement: edges touching the live state stay lit, the rest fade into the void. */
    pairs.forEach(([i, j], e) => {
      a.copy(qubits[i].grp.position); b.copy(qubits[j].grp.position);
      ePos.set([a.x, a.y, a.z, b.x, b.y, b.z], e * 6);
      const w = Math.max(qubits[i].w, qubits[j].w);
      tc.copy(cEm).lerp(scene.background, 1 - w);
      eCol.set([tc.r, tc.g, tc.b, tc.r, tc.g, tc.b], e * 6);
      const p = photons[e];
      p.t = (p.t + dt * (.3 + (qubits[i].f + qubits[j].f) * .9)) % 1;
      p.s.position.lerpVectors(a, b, p.t);
      p.s.material.opacity = p.s.material.userData.o * glowF * w;
    });
    eGeo.attributes.position.needsUpdate = true; eGeo.attributes.color.needsUpdate = true;

    /* Camera: free orbit, easing into the measured node and back out. */
    if (measured >= 0) camNode = qubits[measured];
    camF = ease(camF, measured >= 0 ? 1 : 0, dt, 2.4);
    if (camF < .002) camNode = null;

    /* Parallax stays small on purpose: the camera orbits with the cursor, so a
       strong term makes every node dodge the pointer you are aiming with. */
    const ang = t * .05 * (1 - camF) + mx * .08 * (1 - camF * .8);
    free.set(Math.sin(ang) * 17, 5.4 - my * .45 * (1 - camF), Math.cos(ang) * 17);
    freeAt.set(0, 2.6, -3);
    if (camNode) {
      camNode.grp.getWorldPosition(nodeP);
      camAt.copy(nodeP);
      camPos.copy(free).sub(nodeP).normalize().multiplyScalar(4.2).add(nodeP);
      camPos.y += .5;
      camera.position.lerpVectors(free, camPos, camF);
      lookAt.lerpVectors(freeAt, camAt, camF);
    } else {
      camera.position.copy(free); lookAt.copy(freeAt);
    }
    camera.lookAt(lookAt);
    /* Less bloom up close, not more: at 4 units the halo alone clips to white. */
    if (bloom) bloom.strength = .7 - camF * .28;

    if (!reduce) pick();

    /* HUD: the readout is text, so it updates ~12x a second, not every frame. */
    hudAt += dt;
    if (hudAt > .08 || reduce) {
      hudAt = 0;
      let expr = "";
      qubits.forEach((q, i) => {
        const pct = Math.round(q.p * 100);
        const bar = barEls[i];
        bar.querySelector(".v").textContent = pct + "%";
        bar.querySelector("i").style.width = (q.p * 100).toFixed(1) + "%";
        if (q.p > .004) expr += (expr ? " + " : "") + Math.sqrt(q.p).toFixed(2) + "<b>|" + i + "⟩</b>";
      });
      ketExpr.innerHTML = "|ψ⟩ = " + (expr || "0");
    }

    /* Anchor the panel to the measured node on screen. */
    if (camNode && !panel.hidden) {
      proj.copy(camNode.grp.position).applyMatrix4(world.matrixWorld).project(camera);
      const px = (proj.x * .5 + .5) * W, py = (-proj.y * .5 + .5) * H;
      const pw = panel.offsetWidth, phh = panel.offsetHeight, pad = 18;
      let left = px + 78, top = py - phh * .5;
      if (left + pw > W - pad) left = px - 78 - pw;
      panel.style.left = Math.max(pad, Math.min(W - pw - pad, left)) + "px";
      panel.style.top = Math.max(70, Math.min(H - phh - 76, top)) + "px";
    }

    (dark && composer) ? composer.render() : renderer.render(scene, camera);
  }

  ready = true;
  applyTheme();
  if (reduce) { frame(0); return; }
  let last = performance.now();
  (function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!document.hidden) frame(dt);
  })(last);
})();

/* Language last: the scene is wired, so a switch repaints everything at once. */
try { setLang(localStorage.getItem("wr-lang") === "en" ? "en" : "es"); } catch (e) { setLang("es"); }
</script>
